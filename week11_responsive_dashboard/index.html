<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Admin Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="dashboard-container">
            <aside class="sidebar">
                <h2>Dashboard</h2>
                <nav>
                    <ul>
                        <li>Overview</li>
                        <li>Analytics</li>
                        <li>Reports</li>
                        <li>Settings</li>
                    </ul>
                </nav>
            </aside>
            <header class="header">
                <div class="search-bar">Search Metrics</div>
                <div class="user-profile">Admin Profile</div>
            </header>
            <main class="main-content">
                <div class="dashboard-header">
                    <h2>Overview Statistics</h2>
                </div>

                <div class="cards-wrapper">
                    <div class="card">
                        <div class="card-icon">👥</div>
                        <div class="card-info">
                            <h3>Total Users</h3>
                            <p class="stat">1,540</p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-icon">📥</div>
                        <div class="card-info">
                            <h3>Downloads</h3>
                            <p class="stat">320</p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-icon">💰</div>
                        <div class="card-info">
                            <h3>Revenue</h3>
                            <p class="stat">$450.50</p>
                        </div>
                    </div>

                    <div class="card error-card">
                        <div class="card-icon">⚠️</div>
                        <div class="card-info">
                            <h3>Crashes</h3>
                            <p class="stat">12</p>
                        </div>
                    </div>
                </div>
                
                <div class="table-container">
                    <div class="dashboard-header">
                        <h2>Recent Activity</h2>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Platform</th>
                                <th>Status</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#USD-8492</td>
                                <td>iOS</td>
                                <td><span class="badge success">Completed</span></td>
                                <td>$45.00</td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            
            </main>
        </div>
    </body>
</html>
