<!DOCTYPE <!DOCTYPE html>
<html>
    <head>
    
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>JS Interactive Quiz</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    
    </head>
    <body>

        <div class="app-container">
            <div class="quiz-header">
                <h1>Dev Quiz</h1>
                <p>Score: <span id="score">0</span></p>
            </div>

            <div class="quiz-card" id="quiz-card">
                <h2 id="question-text">Question goes here</h2>
                <div class="options-container">
                    <button class="btn" onclick="checkAnswer(this)">Option A</button>
                    <button class="btn" onclick="checkAnswer(this)">Option B</button>
                    <button class="btn" onclick="checkAnswer(this)">Option C</button>
                    <button class="btn" onclick="checkAnswer(this)">Option D<Data></Data></button>
                </div>
            </div>

            <div id="result-card" class="quiz-card hide">
                <h2>Quiz Completed!</h2>
                <p>Your Final Score:</p>
                <h1 id="final-score" style="font-size: 3em; margin: 20px 0; color: #00ff88;">0 / 4</h1>
                <button class="btn next-btn" onclick="restartQuiz()" style="width: 100%;">Play Again</button>

            </div>
        </div>

        <button id="next-btn" class="btn next-btn hide">Next Question</button>
        
        <script src="script.js" async defer></script>
    </body>
</html>
