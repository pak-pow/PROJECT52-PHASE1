<!DOCTYPE <!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>JS Interactive Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    <div class="app-container">
      <div class="quiz-header">
        <h1>Dev Quiz</h1>
        <p>Score: <span id="score">0</span></p>
      </div>

      <div id="home-screen" class="quiz-card">
        <div class="card-body" style="text-align: center">
          <h2>Welcome, User.</h2>
          <p style="margin-bottom: 30px; color: #aaa">
            What would you like to do?
          </p>
          <div class="options-container">
            <button class="btn option-btn" onclick="startQuiz()">
              ▶️ Play Quiz
            </button>
            <button class="btn option-btn" onclick="showCreator()">
              🛠️ Create Questions
            </button>
          </div>
        </div>
      </div>

      <div id="creator-screen" class="quiz-card hide">
        <div class="card-body">
          <h2>Add New Question</h2>
          <input
            type="text"
            id="new-q"
            class="input-field"
            placeholder="Type question here..."
          />
          <input
            type="text"
            id="new-a"
            class="input-field"
            placeholder="Option A"
          />
          <input
            type="text"
            id="new-b"
            class="input-field"
            placeholder="Option B"
          />
          <input
            type="text"
            id="new-c"
            class="input-field"
            placeholder="Option C"
          />
          <input
            type="text"
            id="new-d"
            class="input-field"
            placeholder="Option D"
          />
          <input
            type="text"
            id="new-correct"
            class="input-field"
            placeholder="Correct Answer (e.g., Option A)"
          />
          <input
            type="text"
            id="new-hint"
            class="input-field"
            placeholder="Hint text..."
          />
        </div>

        <div class="card-footer">
          <button class="footer-btn hint-btn" onclick="goHome()">Back</button>
          <button class="footer-btn next-btn" onclick="saveQuestion()">
            Save 💾
          </button>
        </div>
      </div>

      <div id="game-screen" class="hide">
        <div class="quiz-card" id="quiz-card">
          <div class="card-body">
            <h2 id="question-text">Question goes here</h2>

            <p id="hint-text" class="hint-text hide">Hint: This is a clue.</p>

            <div class="options-container">
              <button class="btn option-btn" onclick="checkAnswer(this)">
                Option A
              </button>
              <button class="btn option-btn" onclick="checkAnswer(this)">
                Option B
              </button>
              <button class="btn option-btn" onclick="checkAnswer(this)">
                Option C
              </button>
              <button class="btn option-btn" onclick="checkAnswer(this)">
                Option D
              </button>
            </div>
          </div>

          <div class="card-footer">
            <button class="footer-btn hint-btn" onclick="showHint()">
              💡 Hint
            </button>
            <button id="next-btn" class="footer-btn next-btn" disabled>
              Next Arrow ➔
            </button>
          </div>
        </div>
      </div>

      <div id="result-card" class="quiz-card hide">
        <div class="card-body">
          <h2>Quiz Completed!</h2>
          <p>Your Final Score:</p>
          <h1
            id="final-score"
            style="font-size: 3em; margin: 20px 0; color: #00ff88"
          >
            0 / 0
          </h1>
          <button
            class="btn next-btn"
            onclick="restartQuiz()"
            style="width: 100%"
          >
            Play Again
          </button>
        </div>
      </div>
    </div>

    <script src="script.js" async defer></script>
  </body>
</html>
